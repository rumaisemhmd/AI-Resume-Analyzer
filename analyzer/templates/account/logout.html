{% extends "base.html" %}

{% block title %}Sign out &mdash; AI Resume Analyzer{% endblock %}

{% block content %}

<section class="max-w-md mx-auto px-4 sm:px-6 py-20 sm:py-28">
  <div class="rounded-xl border border-slate-800 bg-[#171a21] p-8 shadow-xl shadow-black/20 text-center">

    <h1 class="text-xl font-bold text-slate-50">Sign out?</h1>
    <p class="mt-2 text-sm text-slate-400">You'll need to sign in with Google again to see your dashboard.</p>

    <form method="POST" action="{% url 'account_logout' %}" class="mt-7 flex flex-col sm:flex-row gap-3">
      {% csrf_token %}
      {{ redirect_field }}
      <button type="submit" class="flex-1 inline-flex justify-center items-center px-5 py-2.5 rounded-md bg-emerald-500 text-slate-950 font-semibold hover:bg-emerald-400 transition">
        Sign out
      </button>
      <a href="{% url 'home' %}" class="flex-1 inline-flex justify-center items-center px-5 py-2.5 rounded-md border border-slate-700 text-slate-200 font-semibold hover:border-slate-500 transition">
        Cancel
      </a>
    </form>

  </div>
</section>

{% endblock %}
